<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Nexora Quiz Editor</title>

<style>

/* =====================================
   NEXORA DESIGN
===================================== */

:root{

    --background:#0f172a;

    --surface:#111e35;

    --surface-light:#17263f;

    --accent:#38bdf8;

    --accent-hover:#7dd3fc;

    --text:#e5e7eb;

    --muted:#94a3b8;

    --border:
        rgba(
            148,
            163,
            184,
            .15
        );

}

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    font-family:
        "Segoe UI",
        sans-serif;

    background:#0f172a;

    background-image:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(
                14,
                165,
                233,
                .09
            ),
            transparent 55%
        );

    color:var(--text);

    padding:30px;

}

/* =====================================
   EDITOR CONTAINER
===================================== */

.editor{

    max-width:1000px;

    margin:auto;

    padding:30px;

    border-radius:18px;

    background:
        rgba(
            17,
            30,
            53,
            .95
        );

    border:
        1px solid
        var(--border);

}

h1{

    text-align:center;

    color:var(--accent);

    font-size:3rem;

    margin-top:0;

}

h2,
h3{

    color:var(--accent);

}

/* =====================================
   INPUTS
===================================== */

label{

    display:block;

    margin-top:18px;

    margin-bottom:8px;

    color:var(--muted);

    font-weight:600;

}

input,
textarea{

    width:100%;

    padding:14px;

    border-radius:12px;

    border:
        1px solid
        var(--border);

    background:#020617;

    color:var(--text);

    font-size:16px;

}

input:focus,
textarea:focus{

    outline:none;

    border-color:
        rgba(
            56,
            189,
            248,
            .7
        );

}

textarea{

    resize:vertical;

}

/* =====================================
   ANTWORTEN
===================================== */

.answer-row{

    display:grid;

    grid-template-columns:
        40px 1fr;

    gap:12px;

    align-items:center;

    margin-bottom:14px;

}

.answer-row
input[type="radio"]{

    transform:
        scale(1.5);

    cursor:pointer;

}

.answer-row
input[type="text"]{

    height:60px;

}
/* =====================================
   BUTTONS
===================================== */

.button-row{

    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:20px;

}

button{

    border:none;

    border-radius:10px;

    padding:13px 20px;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    transition:.2s ease;

}

button:hover{

    transform:
        translateY(-2px);

}

#addAnswerBtn{

    background:#0ea5e9;

    color:#082f49;

}

#saveQuestionBtn{

    background:#22c55e;

    color:white;

}

#newQuestionBtn{

    background:#f59e0b;

    color:white;

}

#exportBtn{

    width:100%;

    margin-top:25px;

    background:#8b5cf6;

    color:white;

}

/* =====================================
   VORSCHAU
===================================== */

.preview-item{

    margin-top:15px;

    padding:18px;

    border-radius:12px;

    background:
        rgba(
            17,
            30,
            53,
            .95
        );

    border:
        1px solid
        var(--border);

}

.preview-buttons{

    margin-top:15px;

}

.edit-btn{

    background:#f59e0b;

    color:white;

    margin-right:8px;

}

.delete-btn{

    background:#ef4444;

    color:white;

}

/* =====================================
   MOBILE
===================================== */

@media(max-width:700px){

    .editor{

        margin:10px;

        padding:20px;

    }

    h1{

        font-size:2.2rem;

    }

}

</style>
</head>

<body>

<div class="editor">

<h1>Nexora Quiz Editor</h1>

<h2>Quizfrage erstellen</h2>

<label>Frage</label>

<input
    id="questionInput"
    type="text"
    placeholder="Frage eingeben"
>

<label>
Antwortmöglichkeiten
</label>

<div id="answers">

</div>

<div class="button-row">

<button id="addAnswerBtn">
Antwort hinzufügen
</button>

<button id="saveQuestionBtn">
Frage speichern
</button>

<button id="newQuestionBtn">
Neue Frage
</button>

</div>

<label>
Erklärung
</label>

<textarea
    id="explanationInput"
    rows="4"
    placeholder="Optionale Erklärung"
></textarea>

<h3>
Gespeicherte Fragen
</h3>

<div id="previewList">

</div>

<button id="exportBtn">

Quiz als HTML exportieren

</button>

</div>

<script>

let quiz = [];

let editIndex = null;

/* ======================
   ANTWORTFELD
====================== */

function addAnswerField(
    text='',
    checked=false
){

    const div =
        document.createElement(
            'div'
        );

    div.className =
        'answer-row';

    div.innerHTML =

        '<input type="radio" ' +
        'name="correct" ' +
        (checked ? 'checked' : '') +
        '>' +

        '<input type="text" ' +
        'placeholder="Antwort"' +
        ' value="' +
        text.replace(
            /"/g,
            '&quot;'
        ) +
        '">';

    document
    .getElementById(
        'answers'
    )
    .appendChild(div);

}

/* ======================
   SOFORT 3 FELDER
====================== */

addAnswerField();
addAnswerField();
addAnswerField();
/* ======================
   ANTWORT HINZUFÜGEN
====================== */

document
.getElementById(
    'addAnswerBtn'
)
.onclick = function(){

    addAnswerField();

};

/* ======================
   FORMULAR ZURÜCKSETZEN
====================== */

function resetForm(){

    document
    .getElementById(
        'questionInput'
    )
    .value = '';

    document
    .getElementById(
        'explanationInput'
    )
    .value = '';

    document
    .getElementById(
        'answers'
    )
    .innerHTML = '';

    addAnswerField();
    addAnswerField();
    addAnswerField();

}

/* ======================
   FRAGE SPEICHERN
====================== */

document
.getElementById(
    'saveQuestionBtn'
)
.onclick = function(){

    const question =
        document
        .getElementById(
            'questionInput'
        )
        .value
        .trim();

    const explanation =
        document
        .getElementById(
            'explanationInput'
        )
        .value
        .trim();

    const rows =
        document
        .querySelectorAll(
            '.answer-row'
        );

    let options = [];

    let correct = -1;

    rows.forEach(function(
        row
    ){

        const text =
            row.querySelector(
                'input[type="text"]'
            )
            .value
            .trim();

        const radio =
            row.querySelector(
                'input[type="radio"]'
            );

        if(text !== ''){

            if(
                radio.checked
            ){

                correct =
                    options.length;

            }

            options.push(
                text
            );

        }

    });

    if(
        !question ||
        options.length < 2 ||
        correct === -1
    ){

        alert(
            'Bitte mindestens 2 Antworten und eine richtige Antwort auswählen.'
        );

        return;

    }

    const obj = {

        question:
            question,

        options:
            options,

        correct:
            correct,

        explanation:
            explanation

    };

    if(
        editIndex !== null
    ){

        quiz[
            editIndex
        ] = obj;

        editIndex = null;

    }
    else{

        quiz.push(
            obj
        );

    }

    renderPreview();

    resetForm();

};

/* ======================
   VORSCHAU
====================== */

function renderPreview(){

    const preview =
        document
        .getElementById(
            'previewList'
        );

    preview.innerHTML = '';

    quiz.forEach(
        function(q,i){

            const div =
                document
                .createElement(
                    'div'
                );

            div.className =
                'preview-item';

            div.innerHTML =

                '<b>' +
                q.question +
                '</b><br><br>' +

                'Richtige Antwort: <b>' +
                q.options[
                    q.correct
                ] +
                '</b><br><br>' +

                '<div class="preview-buttons">' +

                '<button class="edit-btn" onclick="editQuestion(' +
                i +
                ')">Bearbeiten</button>' +

                '<button class="delete-btn" onclick="deleteQuestion(' +
                i +
                ')">Löschen</button>' +

                '</div>';

            preview.appendChild(
                div
            );

    });

}

/* ======================
   BEARBEITEN
====================== */

function editQuestion(i){

    const q =
        quiz[i];

    editIndex = i;

    document
    .getElementById(
        'questionInput'
    )
    .value =
        q.question;

    document
    .getElementById(
        'explanationInput'
    )
    .value =
        q.explanation;

    const answers =
        document
        .getElementById(
            'answers'
        );

    answers.innerHTML = '';

    q.options.forEach(
        function(
            answer,
            index
        ){

            addAnswerField(

                answer,

                index ===
                q.correct

            );

    });

}

/* ======================
   LÖSCHEN
====================== */

function deleteQuestion(i){

    quiz.splice(
        i,
        1
    );

    renderPreview();

}

/* ======================
   EXPORT
====================== */

document
.getElementById(
    'exportBtn'
)
.onclick = function(){

    const html =

`<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Quiz</title>
</head>
<body>

<script>

const quiz =
${JSON.stringify(
    quiz,
    null,
    2
)};

alert(
'Quiz erfolgreich exportiert.\\n\\n' +
'Hier kommt später das komplette Nexora Quiz Template hinein.'
);

</script>

</body>
</html>`;

    const blob =
        new Blob(
            [html],
            {
                type:
                'text/html'
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const a =
        document
        .createElement(
            'a'
        );

    a.href = url;

    a.download =
        'quiz.html';

    a.click();

};

</script>

</body>
</html>
