<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Quiz Editor</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #7effb2, #6ab0ff);
    padding: 40px;
    display: flex;
    justify-content: center;
}

.editor {
    background: white;
    width: 700px;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* Allgemeine Eingabefelder */
input, textarea {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border-radius: 10px;
    border: 2px solid #ccc;
    font-size: 18px;
    box-sizing: border-box;
}

input:focus, textarea:focus {
    border-color: #3498db;
    background: #eef7ff;
    outline: none;
}

/* Antwortzeilen – jetzt perfekt */
.answer-row {
    display: grid;
    grid-template-columns: 40px 1fr; /* Kreis links, Textfeld rechts */
    align-items: center;
    column-gap: 10px;
    margin-bottom: 16px;
    width: 100%;
}

/* Radio-Button links, größer, sauber */
.answer-row input[type="radio"] {
    justify-self: start;
    transform: scale(1.6);
    cursor: pointer;
    margin-left: 0;
}

/* Großes, modernes Textfeld */
.answer-row input[type="text"] {
    width: 100%;
    height: 65px;
    font-size: 22px;
    padding: 14px 20px;
    border-radius: 12px;
    border: 2px solid #ccc;
    background: white;
    box-sizing: border-box;
}

.answer-row input[type="text"]:focus {
    border-color: #3498db;
    background: #eef7ff;
}

/* Buttons zentriert */
button {
    padding: 14px 22px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
    margin-top: 12px;
    display: block;
    margin-left: auto;
    margin-right: auto;
}

#addAnswerBtn { background: #3498db; color: white; }
#saveQuestionBtn { background: #2ecc71; color: white; }
#newQuestionBtn { background: #f1c40f; color: white; }
#exportBtn { background: #9b59b6; color: white; width: 60%; }

/* Vorschau */
.preview-item {
    background: #f7f7f7;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
    border-left: 5px solid #ccc;
}

.edit-btn { background: #f39c12; color: white; margin-right: 10px; }
.delete-btn { background: #e74c3c; color: white; }
</style>
</head>
<body>

<div class="editor">
    <h2>Quiz-Frage erstellen</h2>

    <label>Frage:</label>
    <input id="questionInput" type="text" placeholder="Frage eingeben">

    <label>Antwortmöglichkeiten:</label>
    <div id="answers"></div>

    <button id="addAnswerBtn">Antwort hinzufügen</button>

    <label>Erklärung:</label>
    <textarea id="explanationInput" rows="3" placeholder="Erklärung eingeben"></textarea>

    <button id="saveQuestionBtn">Frage speichern</button>
    <button id="newQuestionBtn">Neue Frage</button>

    <h3>Gespeicherte Fragen:</h3>
    <div id="previewList"></div>

    <button id="exportBtn">Quiz als HTML erzeugen</button>
</div>

<script>
let quiz = [];
let editIndex = null;

function addAnswerField(text, checked) {
    if (!text) text = "";
    const div = document.createElement("div");
    div.className = "answer-row";

    div.innerHTML =
        '<input type="radio" name="correct" ' + (checked ? 'checked' : '') + '>' +
        '<input type="text" placeholder="Antworttext" value="' + text.replace(/"/g, '&quot;') + '">';

    document.getElementById("answers").appendChild(div);
}

document.getElementById("addAnswerBtn").onclick = function () {
    addAnswerField("", false);
};

addAnswerField("", false);
addAnswerField("", false);

document.getElementById("newQuestionBtn").onclick = function () {
    resetForm();
};

document.getElementById("saveQuestionBtn").onclick = function () {
    const question = document.getElementById("questionInput").value.trim();
    const explanation = document.getElementById("explanationInput").value.trim();
    const answerRows = document.querySelectorAll(".answer-row");

    let options = [];
    let correctIndex = -1;

    answerRows.forEach(function (row) {
        const text = row.querySelector('input[type="text"]').value.trim();
        const radio = row.querySelector('input[type="radio"]');

        if (text !== "") {
            if (radio.checked) correctIndex = options.length;
            options.push(text);
        }
    });

    if (!question || options.length < 2 || correctIndex === -1) {
        alert("Bitte Frage, mindestens 2 Antworten und eine richtige Antwort angeben.");
        return;
    }

    const newQuestion = {
        question: question,
        options: options,
        correct: correctIndex,
        explanation: explanation
    };

    if (editIndex !== null) {
        quiz[editIndex] = newQuestion;
        editIndex = null;
    } else {
        quiz.push(newQuestion);
    }

    renderPreview();
    resetForm();
};

function resetForm() {
    document.getElementById("questionInput").value = "";
    document.getElementById("explanationInput").value = "";
    document.getElementById("answers").innerHTML = "";
    addAnswerField("", false);
    addAnswerField("", false);
}

function renderPreview() {
    const preview = document.getElementById("previewList");
    preview.innerHTML = "";

    quiz.forEach(function (q, i) {
        const div = document.createElement("div");
        div.className = "preview-item";

        div.innerHTML =
            "<b>" + q.question + "</b><br>" +
            "Antworten: " + q.options.join(", ") + "<br>" +
            "Richtige Antwort: <b>" + q.options[q.correct] + "</b><br>" +
            '<button class="edit-btn" onclick="editQuestion(' + i + ')">Bearbeiten</button>' +
            '<button class="delete-btn" onclick="deleteQuestion(' + i + ')">Löschen</button>';

        preview.appendChild(div);
    });
}

function editQuestion(i) {
    const q = quiz[i];
    editIndex = i;

    document.getElementById("questionInput").value = q.question;
    document.getElementById("explanationInput").value = q.explanation;

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.options.forEach(function (opt, idx) {
        addAnswerField(opt, idx === q.correct);
    });
}

function deleteQuestion(i) {
    quiz.splice(i, 1);
    renderPreview();
}

document.getElementById("exportBtn").onclick = function () {
    let html = "";
    html += "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Quiz</title>";

    html += "<style>";
    html += "body{font-family:Arial;background:linear-gradient(135deg,#6a11cb,#2575fc);padding:40px;display:flex;justify-content:center;}";
    html += ".card{background:white;width:520px;padding:25px;border-radius:18px;box-shadow:0 10px 25px rgba(0,0,0,0.3);animation:fadeIn 0.5s ease;}";
    html += "@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}";
    html += ".option{background:#f0f0f0;padding:12px;border-radius:10px;margin:10px 0;cursor:pointer;border:2px solid transparent;transition:0.2s;}";
    html += ".option:hover{background:#e0e0e0;}";
    html += ".correct{background:#c8f7c5!important;border-color:#2ecc71;}";
    html += ".wrong{background:#f7c5c5!important;border-color:#e74c3c;}";
    html += "#nextBtn{margin-top:20px;padding:12px;width:100%;background:#3498db;color:white;border:none;border-radius:10px;font-size:16px;cursor:pointer;display:none;}";
    html += "#nextBtn:hover{background:#217dbb;}";
    html += "</style>";

    html += "</head><body>";
    html += "<div class='card'><h2 id='question'></h2><div id='options'></div><div id='explanation'></div><button id='nextBtn'>Nächste Frage</button></div>";

    html += "<script>";
    html += "const quiz=" + JSON.stringify(quiz) + ";";
    html += "let current=0;let score=0;let userAnswers=[];";
    html += "const qEl=document.getElementById('question');const oEl=document.getElementById('options');const eEl=document.getElementById('explanation');const nextBtn=document.getElementById('nextBtn');";

    html += "function loadQuestion(){const q=quiz[current];qEl.textContent=q.question;oEl.innerHTML='';eEl.innerHTML='';nextBtn.style.display='none';q.options.forEach(function(text,index){const btn=document.createElement('div');btn.className='option';btn.textContent=text;btn.onclick=function(){document.querySelectorAll('.option').forEach(function(o){o.style.pointerEvents='none'});userAnswers.push(index);if(index===q.correct){btn.classList.add('correct');score++;}else{btn.classList.add('wrong');}eEl.innerHTML=q.explanation;nextBtn.style.display='block';};oEl.appendChild(btn);});}";

    html += "nextBtn.onclick=function(){current++;if(current<quiz.length)loadQuestion();else showResults();};";

    html += "function showResults(){qEl.textContent='Auswertung';oEl.innerHTML='';eEl.innerHTML='';quiz.forEach(function(q,i){const div=document.createElement('div');div.innerHTML='<b>'+q.question+'</b><br>Deine Antwort: '+(q.options[userAnswers[i]]||'Keine')+'<br>Richtige Antwort: <b>'+q.options[q.correct]+'</b><br><br>';oEl.appendChild(div);});}";

    html += "loadQuestion();";
    html += "<\/script>";

    html += "</body></html>";

    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "quiz.html";
    a.click();
};
</script>

</body>
</html>
